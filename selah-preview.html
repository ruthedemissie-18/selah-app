<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selah — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#4B5136;
    --olive-dark:#393E28;
    --sage:#8A8F73;
    --walnut:#6B4426;
    --cream:#FFF5EC;
    --taupe:#CBB9A3;
    --ink:#2E2A22;
    --ink-soft:#6B6455;
    --white:#FFFFFF;
    --line:#E7DDCE;
    --danger:#B3543E;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#DCD6C8;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:32px 12px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3,h4{font-family:'Merriweather',serif;margin:0;font-weight:700;color:var(--ink);}
  p{margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;}
  input,textarea{font-family:'Inter',sans-serif;}

  #phone{
    width:390px;
    max-width:100%;
    height:826px;
    background:var(--cream);
    border-radius:44px;
    border:10px solid var(--ink);
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-bottom-left-radius:16px;
    border-bottom-right-radius:16px;
    z-index:50;
  }
  #screen{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    scrollbar-width:none;
  }
  #screen::-webkit-scrollbar{display:none;}

  .pad{padding:28px 22px;}
  .center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;}

  /* Logo */
  .ichthys-logo{ width:220px; height:auto; }
  .verse-card{
    background:var(--white);
    border-radius:20px;
    padding:22px 24px;
    box-shadow:0 4px 14px rgba(46,42,34,0.06);
  }
  .verse-quote{
    font-family:'Merriweather',serif;
    font-size:15px;
    font-style:italic;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .verse-source{
    margin-top:12px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--walnut);
    text-transform:uppercase;
  }

  /* Buttons */
  .btn-primary{
    width:100%;
    background:var(--olive);
    color:var(--white);
    padding:15px 18px;
    border-radius:16px;
    font-size:15px;
    font-weight:600;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:active{transform:scale(0.98); background:var(--olive-dark);}
  .btn-primary:disabled{background:var(--taupe); color:var(--white); cursor:not-allowed;}
  .btn-ghost{
    width:100%;
    background:transparent;
    color:var(--olive);
    padding:14px 18px;
    border-radius:16px;
    font-size:14px;
    font-weight:600;
    border:1.5px solid var(--olive);
  }
  .btn-link{color:var(--walnut); font-weight:600; font-size:13.5px;}

  /* Inputs */
  .field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .field-input{
    width:100%;
    padding:13px 14px;
    border-radius:13px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .field-input:focus{border-color:var(--sage);}

  /* Onboarding shell */
  .onboard-wrap{display:flex; flex-direction:column; height:100%;}
  .onboard-top{padding:38px 22px 0;}
  .step-dots{display:flex; gap:8px; margin-bottom:12px;}
  .step-dot-btn{flex:1; padding:4px 0; background:none; border:none; cursor:pointer;}
  .step-dot-btn:disabled{cursor:default;}
  .step-dot-bar{display:block; height:11px; border-radius:6px; background:var(--line);}
  .step-dot-bar.done{background:var(--olive);}
  .onboard-body{flex:1; overflow-y:auto; padding:0 22px 18px; display:flex; flex-direction:column; justify-content:flex-start;}
  .onboard-body.center-content{justify-content:center;}
  .field-error{color:var(--danger); font-size:11.5px; margin-bottom:10px; margin-top:2px;}
  .onboard-foot{padding:14px 22px 22px; border-top:1px solid var(--line); background:var(--cream);}
  .skip-row{text-align:center; margin-top:12px;}
  .subtle-skip{font-size:11px; color:var(--ink-soft); opacity:0.75; text-decoration:underline; text-underline-offset:2px; font-weight:500;}

  .chip{
    display:inline-flex; align-items:center;
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    margin:4px 6px 4px 0;
  }
  .chip.selected{background:var(--olive); border-color:var(--olive); color:var(--white);}
  .chip-wrap{display:flex; flex-wrap:wrap;}
  .section-note{font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:20px;}
  .info-box{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--taupe); background:rgba(203,185,163,0.3);
    border-radius:14px; padding:13px 14px; margin-bottom:24px;
    font-size:12.5px; line-height:1.5; color:var(--ink);
  }
  .info-box svg{width:17px; height:17px; flex-shrink:0; margin-top:1px; color:var(--olive-dark);}
  .field-label-caps{
    font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:10px; display:block;
  }
  .select-field{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; border-radius:13px; border:1.5px solid var(--line);
    background:var(--white); font-size:14.5px; color:var(--ink); text-align:left;
  }
  .select-field svg{width:16px; height:16px; color:var(--ink-soft); flex-shrink:0;}
  .book-group-label{
    font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-soft); padding:14px 4px 6px;
  }
  .book-row{
    width:100%; text-align:left; padding:12px 6px; font-size:14.5px; color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .book-row:active{background:var(--cream);}


  /* Transition screen */
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:4px solid var(--taupe);
    border-top-color:var(--olive);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .transition-phrase{font-size:18px; margin-top:22px; transition:opacity .25s ease; min-height:26px;}

  /* App shell */
  #app-body{flex:1; overflow-y:auto; padding-bottom:110px;}
  .app-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:38px 20px 6px;
  }
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .topbar-logo{
    width:38px; height:38px; border-radius:11px;
    background:var(--cream); border:1px solid rgba(203,185,163,0.45);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    overflow:hidden;
  }
  .topbar-logo svg{width:19px; height:19px; color:var(--olive);}
  .topbar-logo-img{width:100%; height:100%; object-fit:cover;}
  .welcome-name{font-size:16px; font-weight:700; font-family:'Merriweather',serif;}
  .welcome-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .streak-pill{
    display:flex; align-items:center; gap:5px; flex-shrink:0;
    background:#F4DBA6; color:#B4611C;
    padding:7px 13px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    margin:12px 20px;
  }
  .card-title{font-size:13px; font-weight:700; text-transform:none; color:var(--ink-soft); margin-bottom:10px; letter-spacing:0.02em;}

  .insight-box{
    display:flex; align-items:flex-start; gap:10px;
    margin:14px 20px 4px;
    background:rgba(203,185,163,0.3);
    border-radius:16px; padding:15px 16px;
    font-size:13px; line-height:1.55; color:var(--ink);
  }
  .insight-box svg{width:19px; height:19px; flex-shrink:0; margin-top:1px; color:var(--olive-dark);}
  .insight-box strong{font-weight:700;}
  .insight-box u{text-decoration-color:var(--olive); text-underline-offset:2px;}

  .scripture-card{
    margin:14px 20px 4px;
    background:var(--olive);
    border-radius:18px;
    padding:20px 20px 18px;
  }
  .scripture-eyebrow{font-size:11px; font-weight:700; letter-spacing:0.06em; color:rgba(255,245,236,0.65);}
  .scripture-text{font-family:'Merriweather',serif; font-size:17px; font-style:italic; line-height:1.55; color:var(--cream); margin-top:12px;}
  .scripture-ref{margin-top:12px; font-size:12.5px; font-weight:700; color:var(--accent, #E8C39E);}
  .scripture-footer{display:flex; align-items:center; justify-content:space-between; margin-top:16px; gap:10px;}
  .join-discussion-btn{
    display:flex; align-items:center; gap:7px;
    background:rgba(255,245,236,0.14); color:var(--cream);
    padding:9px 14px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap;
  }
  .join-discussion-btn svg{width:15px; height:15px;}

  .prayer-card-title{display:flex; align-items:center; gap:9px; font-size:16px; font-weight:700; font-family:'Merriweather',serif;}
  .prayer-card-title svg{width:18px; height:18px; color:var(--ink);}
  .prayer-divider{height:1px; background:var(--line); margin:12px 0 14px;}
  .prayer-inner-box{background:rgba(203,185,163,0.25); border-radius:14px; padding:15px 16px;}
  .prayer-author-row{display:flex; align-items:center; gap:7px;}
  .flag-badge{font-size:10px; font-weight:700; color:var(--ink-soft); letter-spacing:0.03em;}
  .prayer-author-name{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .prayer-quote{font-family:'Merriweather',serif; font-style:italic; font-size:14px; line-height:1.55; color:var(--ink); margin-top:10px;}
  .prayer-row{display:flex; align-items:center; justify-content:flex-end; margin-top:14px;}
  .pray-btn{
    display:flex; align-items:center; gap:6px;
    padding:9px 15px; border-radius:999px;
    background:var(--white); border:1.5px solid var(--taupe);
    font-size:12.5px; font-weight:700; color:var(--olive);
  }
  .pray-btn.active{background:var(--olive); border-color:var(--olive); color:var(--white);}
  .pray-btn svg{width:14px; height:14px;}

  .submit-prayer-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:calc(100% - 40px); margin:4px 20px 4px;
    padding:13px 16px; border-radius:999px;
    border:1.5px dashed var(--olive); background:transparent;
    color:var(--olive); font-size:13.5px; font-weight:700;
  }
  .submit-prayer-btn svg{width:15px; height:15px;}

  .verse-text{font-family:'Merriweather',serif; font-size:16.5px; font-style:italic; line-height:1.55; color:var(--ink);}
  .verse-ref{margin-top:8px; font-size:12.5px; font-weight:600; color:var(--walnut);}

  textarea.field-input{resize:none; min-height:64px;}

  .section-heading{padding:16px 20px 4px; display:flex; align-items:center; justify-content:space-between;}
  .search-wrap{padding:0 20px 8px;}

  .protected-note{
    display:flex; align-items:center; gap:8px;
    margin:2px 20px 10px; padding:10px 14px;
    background:var(--taupe); background:rgba(203,185,163,0.35);
    border-radius:12px; font-size:12px; color:var(--olive-dark); font-weight:600;
  }

  /* Discussion Hub */
  .protected-pill{
    display:flex; align-items:center; gap:5px;
    background:#DCEEDF; color:#2F7A45;
    padding:6px 11px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;
  }
  .protected-pill svg{width:13px; height:13px;}
  .topic-scroll{display:flex; gap:8px; overflow-x:auto; padding:0 20px 14px; scrollbar-width:none;}
  .topic-scroll::-webkit-scrollbar{display:none;}
  .topic-chip{
    display:flex; align-items:center; gap:5px; flex-shrink:0;
    padding:9px 14px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--white); font-size:12.5px; font-weight:700; color:var(--ink); white-space:nowrap;
  }
  .topic-chip.active{background:var(--olive); border-color:var(--olive); color:var(--white);}
  .topic-header-card{
    background:var(--white); border:1px solid var(--line); border-radius:16px;
    margin:0 20px 12px; padding:15px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topic-header-title{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; font-family:'Merriweather',serif;}
  .topic-header-sub{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .active-badge{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--cream); color:var(--ink-soft);}

  .chat-feed{padding:0 20px;}
  .chat-msg{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px;}
  .chat-msg-top{display:flex; align-items:baseline; justify-content:space-between;}
  .chat-msg-author{font-size:13px; font-weight:700; font-family:'Merriweather',serif;}
  .chat-msg-time{font-size:11px; color:var(--ink-soft);}
  .chat-msg-text{font-size:13.5px; line-height:1.5; color:var(--ink); margin-top:6px;}
  .chat-msg-foot{display:flex; justify-content:flex-end; margin-top:9px;}
  .amen-btn{
    display:flex; align-items:center; gap:5px;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--cream); font-size:11.5px; font-weight:700; color:var(--olive-dark);
  }
  .amen-btn.active{background:var(--olive); border-color:var(--olive); color:var(--white);}

  .chat-input-row{
    display:flex; gap:8px; padding:10px 20px 4px; align-items:center;
  }
  .chat-input{
    flex:1; padding:12px 15px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--white); font-size:13px; color:var(--ink);
  }
  .send-btn{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    background:var(--olive); color:var(--white);
    padding:12px 16px; border-radius:999px; font-size:12.5px; font-weight:700;
  }
  .send-btn svg{width:14px; height:14px;}

  .list-card{
    background:var(--white); border:1px solid var(--line); border-radius:16px;
    padding:15px 16px; margin:0 20px 12px;
  }
  .list-card-top{display:flex; align-items:center; justify-content:space-between;}
  .list-card-title{font-size:14.5px; font-weight:700; font-family:'Merriweather',serif;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--cream); color:var(--olive);}
  .list-card-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .list-card-meta{display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--ink-soft);}

  .filter-row{display:flex; gap:7px; padding:0 20px 4px; flex-wrap:wrap;}
  .filter-chip{
    padding:7px 13px; border-radius:999px; border:1.5px solid var(--line);
    font-size:12px; font-weight:600; background:var(--white); color:var(--ink-soft);
  }
  .filter-chip.on{background:var(--olive); border-color:var(--olive); color:var(--white);}

  .search-create-btn{
    display:flex; align-items:center; gap:10px;
    width:calc(100% - 40px); margin:0 20px 6px;
    padding:13px 16px; border-radius:14px;
    background:var(--white); border:1.5px solid var(--line);
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .search-create-btn svg{width:17px; height:17px; color:var(--ink-soft); flex-shrink:0;}
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(46,42,34,0.4); z-index:60;
    display:flex; align-items:flex-end;
  }
  .sheet{
    width:100%; max-height:88%; background:var(--cream);
    border-top-left-radius:26px; border-top-right-radius:26px;
    display:flex; flex-direction:column; overflow:hidden;
    position:relative;
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 10px; border-bottom:1px solid var(--line);
  }
  .sheet-tabs{display:flex; gap:6px; padding:12px 20px 0;}
  .sheet-tab{
    flex:1; text-align:center; padding:9px 0; border-radius:999px;
    font-size:12.5px; font-weight:700; background:var(--white); border:1.5px solid var(--line); color:var(--ink-soft);
  }
  .sheet-tab.on{background:var(--olive); border-color:var(--olive); color:var(--white);}
  .sheet-body{flex:1; overflow-y:auto; padding:14px 20px 24px;}
  .close-x{font-size:20px; color:var(--ink-soft); line-height:1;}
  .form-row{margin-bottom:12px;}

  /* Bible Study — header card & reference-style sections */
  .bs-header-card{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--white); border-radius:20px; margin:22px 20px 10px;
    padding:20px 18px;
  }
  .bs-header-left{display:flex; align-items:center; gap:14px;}
  .bs-icon-badge{
    width:46px; height:46px; border-radius:50%; background:var(--cream);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .bs-icon-badge svg{width:21px; height:21px; color:var(--olive);}
  .bs-header-title{font-size:18px; line-height:1.3;}
  .bs-header-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4; max-width:160px;}
  .bs-header-right{display:flex; align-items:center; gap:14px; padding-left:14px; border-left:1px solid var(--line);}
  .bs-greeting{font-size:12.5px; color:var(--ink-soft); line-height:1.35; text-align:right;}
  .plus-round-btn{
    width:38px; height:38px; border-radius:50%; background:var(--olive); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1; flex-shrink:0;
  }
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:0.04em; color:var(--ink-soft); text-transform:uppercase;}
  .bs-section{padding:14px 20px 4px;}
  .bs-section-top{display:flex; align-items:center; justify-content:space-between;}
  .groups-max-inline{font-size:10.5px; font-weight:700; letter-spacing:0.03em; color:var(--ink-soft); text-transform:uppercase;}
  .bs-heading{font-size:22px; line-height:1.35; margin-top:8px;}
  .groups-max{font-size:10.5px; color:var(--ink-soft); text-align:right; line-height:1.3; font-weight:600;}
  .bs-subtext{font-size:13px; color:var(--ink-soft); margin-top:8px; margin-bottom:16px;}
  .bs-circle-meta{display:flex; align-items:center; gap:16px; margin-top:7px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .bs-meta-item{display:flex; align-items:center; gap:5px;}
  .meta-icon{width:13px; height:13px; color:var(--ink-soft); flex-shrink:0;}
  .bs-status-pill{display:inline-flex; align-items:center; gap:5px; background:rgba(140,143,115,0.18); padding:4px 11px; border-radius:999px; font-size:10.5px; font-weight:800; letter-spacing:0.02em; color:var(--olive-dark);}
  .bs-status-dot{width:6px; height:6px; border-radius:50%; background:var(--olive); flex-shrink:0;}
  .bs-status-pill.full{background:rgba(179,84,62,0.14); color:var(--danger);}
  .bs-status-pill.full .bs-status-dot{background:var(--danger);}
  .bs-status-pill.live{background:rgba(232,169,79,0.28); color:#8a5a12;}
  .bs-status-pill.live .bs-status-dot{background:#E8A94F;}

  .bs-circle-desc{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.45;}
  .bs-meta-row{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:13px; color:var(--ink);}
  .bs-meta-icon-badge{
    width:30px; height:30px; border-radius:50%; background:var(--cream);

const ICHTHYS_SVG = '<img class="ichthys-logo" alt="Selah logo" src="'+LOGO_SRC+'">';

function renderSplash(){
  return '<div class="pad center-col">'
    + ICHTHYS_SVG
    + '<div class="verse-card" style="margin-top:34px;">'
    + '<p class="verse-quote">Let us spur one another on toward love and good deeds, not giving up meeting together, but encouraging each other as we see the day approaching.</p>'
    + '<p class="verse-source">— Hebrews 10:24-25</p>'
    + '</div>'
    + '<p style="font-size:14.5px; color:var(--ink-soft); margin-top:26px; max-width:260px;">Find your community and build your own.</p>'
    + '<div style="width:100%; margin-top:36px;">'
    + '<button class="btn-primary" onclick="setState({screen:\'auth\'})">Get Started</button>'
    + '</div></div>';
}

const ONBOARD_STEPS = ['auth','location','book','interests','struggles'];
function stepDots(currentScreen){
  const idx = ONBOARD_STEPS.indexOf(currentScreen);
  const dots = ONBOARD_STEPS.map((s,i) => {
    const done = i <= idx;
    // Once past the account step, it locks — can't go back to sign up/log in again.
    const clickable = i <= idx && (i !== 0 || idx === 0);
    return '<button class="step-dot-btn" '+(clickable?'onclick="setState({screen:\''+s+'\'})"':'disabled')+'><span class="step-dot-bar '+(done?'done':'')+'"></span></button>';
  }).join('');
  return '<div class="step-dots">'+dots+'</div>';
}

function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function authIsValid(){
  const isSignup = state.authMode === 'signup';
  const emailOk = isValidEmail(state.email);
  const passOk = state.password.length >= 6;
  if(!isSignup) return emailOk && passOk;
  const nameOk = state.name.trim().length > 0;
  const confirmOk = state.password.length > 0 && state.confirmPassword === state.password;
  return emailOk && passOk && nameOk && confirmOk;
}

function renderAuth(){
  const isSignup = state.authMode === 'signup';
  const emailTouched = state.email.length > 0;
  const emailBad = emailTouched && !isValidEmail(state.email);
  const confirmTouched = state.confirmPassword.length > 0;
  const confirmBad = isSignup && confirmTouched && state.confirmPassword !== state.password;
  const valid = authIsValid();
  return '<div class="onboard-wrap">'
    + '<div class="onboard-top">'+stepDots('auth')+'</div>'
    + '<div class="onboard-body center-content">'
    + '<h2 style="font-size:22px;">'+(isSignup?'Create your account':'Welcome back')+'</h2>'
    + '<p class="section-note" style="margin-top:8px;">'+(isSignup?'Join a community growing in God together.':'Log in to continue your journey.')+'</p>'
    + (isSignup ? '<label class="field-label">Name</label><input class="field-input" data-field="auth-name" style="margin-bottom:18px;" placeholder="Michael" value="'+state.name+'" oninput="setState({name:this.value})">' : '')
    + '<label class="field-label">Email</label>'
    + '<input class="field-input" data-field="auth-email" style="'+(emailBad?'border-color:var(--danger);':'')+'margin-bottom:'+(emailBad?'4px':'14px')+';" placeholder="michael@example.com" value="'+state.email+'" oninput="setState({email:this.value})">'
    + (emailBad ? '<p class="field-error">Enter a valid email, like michael@example.com</p>' : '')
    + '<label class="field-label" style="'+(emailBad?'margin-top:10px;':'')+'">Password</label>'
    + '<input type="password" class="field-input" data-field="auth-password" style="margin-bottom:'+(isSignup?'18px':'0')+';" placeholder="At least 6 characters" value="'+state.password+'" oninput="setState({password:this.value})">'
    + (isSignup ? '<label class="field-label">Confirm Password</label><input type="password" class="field-input" data-field="auth-confirm" style="'+(confirmBad?'border-color:var(--danger);':'')+'" placeholder="Re-enter your password" value="'+state.confirmPassword+'" oninput="setState({confirmPassword:this.value})">' : '')
    + (confirmBad ? '<p class="field-error">Passwords don\'t match</p>' : '')

function nowTimeString(){
  const d = new Date();
  let h = d.getHours(); const m = d.getMinutes();
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;
  const mm = m<10 ? '0'+m : m;
  return h+':'+mm+' '+ampm;
}
function defaultMessagesFor(topic){
  return [{id:'gen-'+topic, author:'Selah Team', time:'—', text:'Welcome to the '+topic+' discussion! Share your thoughts and encourage one another here.', amens:5}];
}
function messagesFor(topic){
  return state.discussionMessages[topic] || (DISCUSSION_SEED[topic] ? DISCUSSION_SEED[topic].messages : defaultMessagesFor(topic));

function sendDiscussionMessage(){
  const topic = state.selectedDiscussion;
  const text = state.discussionDraft.trim();
  if(!text) return;
  const existing = messagesFor(topic);
  const newMsg = {id:'u'+Date.now(), author: state.name || 'You', time: nowTimeString(), text, amens:0};
  setState({
    discussionMessages: Object.assign({}, state.discussionMessages, {[topic]: [...existing, newMsg]}),
    discussionDraft: ''
  });
}
function amenMessage(id){
  const topic = state.selectedDiscussion;
  const already = state.amenedIds.includes(id);
  const base = messagesFor(topic);
  const updated = base.map(m => m.id===id ? Object.assign({}, m, {amens: m.amens + (already ? -1 : 1)}) : m);
  setState({
    discussionMessages: Object.assign({}, state.discussionMessages, {[topic]: updated}),
    amenedIds: already ? state.amenedIds.filter(x=>x!==id) : [...state.amenedIds, id]
  });
}

    + '</div>'
    + '<div style="height:10px;"></div>';

function allCircles(){ return [...CIRCLES_POOL, ...state.customCircles]; }

function statusPillHtml(c, isFullNotJoined){
  if(c.live) return '<span class="bs-status-pill live"><span class="bs-status-dot"></span>LIVE</span>';
  if(isFullNotJoined) return '<span class="bs-status-pill full"><span class="bs-status-dot"></span>FULL</span>';
  return '<span class="bs-status-pill"><span class="bs-status-dot"></span>OPEN</span>';
}

function bsCircleCard(c, joined){
  const isJoined = joined.includes(c.id);
  const atCircleLimit = joined.length >= 2 && !isJoined;
  const isFull = c.members >= c.capacity && !isJoined;
  const pct = Math.min(100, Math.round((c.members / c.capacity) * 100));
  let btnLabel = 'Join this circle';
  let btnClass = '';
  let disabled = false;
  let onclickAttr = 'openJoinConfirm('+c.id+')';
  if(isJoined){ btnLabel = 'Joined · Leave'; btnClass = 'joined'; onclickAttr = 'leaveCircle('+c.id+')'; }
  else if(isFull){ btnLabel = 'Study is full'; disabled = true; onclickAttr = ''; }
  else if(atCircleLimit){ btnLabel = 'Swap to join'; }
  return '<div class="bs-circle-card">'
    + '<div class="bs-circle-top"><span class="eyebrow">'+c.category+'</span>'+statusPillHtml(c, isFull)+'</div>'
    + '<div class="bs-circle-title">'+c.name+'</div>'
    + '<div class="bs-circle-meta"><span class="bs-meta-item">'+icon('people','class="meta-icon"')+'Led by '+c.leader+'</span><span class="bs-meta-item">'+icon('clock','class="meta-icon"')+c.time+'</span></div>'
    + '<div class="bs-progress-track"><div class="bs-progress-fill" style="width:'+pct+'%;"></div></div>'
    + '<div class="bs-members-label">'+c.members+'/'+c.capacity+' members</div>'
    + '<button class="btn-primary bs-join-btn '+btnClass+'" '+(disabled?'disabled':'')+' onclick="'+onclickAttr+'">'+btnLabel+'</button>'
    + '</div>';
}

function bsJoinedCircleCard(c){
  const pct = Math.min(100, Math.round((c.members / c.capacity) * 100));
  return '<div class="bs-circle-card">'
    + '<div class="bs-circle-top"><span class="eyebrow">'+c.category+'</span>'+statusPillHtml(c, false)+'</div>'
    + '<div class="bs-circle-title">'+c.name+'</div>'
    + '<div class="bs-circle-desc">'+c.description+'</div>'
    + '<div class="bs-meta-row"><div class="bs-meta-icon-badge">'+icon('people')+'</div><span>Led by '+c.leader+'</span></div>'
    + '<div class="bs-meta-row"><div class="bs-meta-icon-badge">'+icon('clock')+'</div><span>'+c.time+'</span></div>'
    + '<div class="bs-progress-track"><div class="bs-progress-fill" style="width:'+pct+'%;"></div></div>'
    + '<div class="bs-members-label">'+c.members+'/'+c.capacity+' members</div>'
    + '<button class="btn-primary bs-join-btn" onclick="openCircle('+c.id+')">Open Circle</button>'
    + '<button class="find-another-link" onclick="setState({bsView:\'browse\'})">Find another group</button>'
    + '</div>';
}

function bsHeaderCard(showPlus){
  return '<div class="bs-header-card">'
    + '<div class="bs-header-left"><div class="bs-icon-badge">'+icon('book')+'</div><div><div class="bs-header-title">Bible Study</div><div class="bs-header-sub">Find your circle. Grow in the Word.</div></div></div>'
    + (showPlus
        ? '<div class="bs-header-right"><div class="bs-greeting">Hi, '+firstName(state.name)+'</div><button class="plus-round-btn" onclick="setState({bsView:\'browse\'})">+</button></div>'
        : '<div class="bs-header-right"><div class="bs-greeting">Hi, '+firstName(state.name)+'</div></div>')
    + '</div>';
}

function renderBibleStudy(){
  if(state.bsView === 'browse') return renderBibleStudyBrowse();

  const joined = state.joinedCircles;
  const pool = allCircles();
  const topic = state.book || 'General Discussion';

  const joinedCards = joined.map(id => allCircles().find(c=>c.id===id)).filter(Boolean).map(bsJoinedCircleCard).join('');

  const matched = pool.filter(c => !joined.includes(c.id) && (!state.book || c.category.toLowerCase() === state.book.toLowerCase()));
  const shown = matched.length ? matched : pool.filter(c => !joined.includes(c.id));
  const recCards = shown.slice(0,3).map(c => bsCircleCard(c, joined)).join('');

  const yourCirclesSection = joined.length
    ? '<div class="bs-section" style="padding-top:18px;"><div class="eyebrow">Your Circles</div>'+joinedCards+'</div>'
    : '';

  const recBlock = matched.length
    ? recCards
    : (shown.length ? recCards : '<div class="empty-box">We don\'t have a '+topic+' circle open right now, but new groups are starting soon. Use the search or the '+"'"+'+'+"'"+' button to explore other books!</div>');

  return ''
    + bsHeaderCard(true)
    + yourCirclesSection
    + '<div class="bs-section" style="padding-top:'+(joined.length?'8px':'14px')+';">'
    + '<div class="bs-section-top"><span class="eyebrow">Matched to your book</span><span class="groups-max-inline">2 groups max</span></div>'
    + '<h2 class="bs-heading">Spaces studying '+topic+'</h2>'
    + '<div class="bs-subtext">Pick a circle to start growing together.</div>'
    + recBlock
    + '</div>';
}

function renderBibleStudyBrowse(){
  const joined = state.joinedCircles;
  const pool = allCircles();
  const filterDefs = ['Local','Online','Old Testament','New Testament'];
  const filterRow = filterDefs.map(f => '<button class="filter-chip-solid '+(state.circleFilters.includes(f)?'on':'')+'" onclick="toggleCircleFilter(\''+f+'\')">'+f+'</button>').join('');

  const results = pool.filter(c => {
    const matchesSearch = (c.name+' '+c.category+' '+c.leader).toLowerCase().includes(state.circleSearch.toLowerCase());
    if(!state.circleFilters.length) return matchesSearch;
    return matchesSearch && state.circleFilters.some(f => {
      if(f==='Local') return c.format==='Local';
      if(f==='Online') return c.format==='Online';
      if(f==='Old Testament') return c.testament==='OT';
      if(f==='New Testament') return c.testament==='NT';
      return true;
    });
  });
  const resultCards = results.map(c => bsCircleCard(c, joined)).join('') || '<div class="empty-note">No circles match your search.</div>';

  return ''
    + bsHeaderCard(false)
    + '<div style="padding:2px 20px 4px;"><button class="back-btn" onclick="setState({bsView:\'home\'})">'+icon('arrowleft')+' Back</button></div>'
    + '<div class="bs-section" style="margin-top:6px;">'
    + '<div class="eyebrow">All circles</div>'
    + '<h2 class="bs-heading" style="max-width:100%;">Browse Bible study groups</h2>'
    + '<div class="bs-subtext">Choose a circle to begin your journey.</div>'
    + '<button class="btn-primary create-study-btn" onclick="openBibleSheet()">+ Create a Study</button>'
    + '</div>'
    + '<div class="search-wrap" style="margin-top:6px;"><input class="field-input" data-field="circle-search" placeholder="Search by book, leader, or topic…" value="'+state.circleSearch+'" oninput="setState({circleSearch:this.value})"></div>'
    + '<div class="filter-row">'+filterRow+'</div>'
    + '<div class="results-count">'+results.length+' circles found</div>'
    + resultCards;
}

/* ---------- Join / Swap flow ---------- */
function openJoinConfirm(id){
  if(state.joinedCircles.length >= 2 && !state.joinedCircles.includes(id)){
    setState({ swapTargetId: id });
  } else {
    setState({ joinConfirmId: id });
  }
}
function cancelJoinConfirm(){ setState({ joinConfirmId: null }); }
function confirmJoin(){
  const id = state.joinConfirmId;
  if(id == null) return;
  if(!state.joinedCircles.includes(id)){
    setState({ joinedCircles:[...state.joinedCircles, id], joinConfirmId:null });
  } else {
    setState({ joinConfirmId:null });
  }
}
function cancelSwap(){ setState({ swapTargetId: null }); }
function performSwap(dropId){
  const newId = state.swapTargetId;
  if(newId == null) return;
  const updated = state.joinedCircles.filter(x => x !== dropId);
  setState({ joinedCircles:[...updated, newId], swapTargetId:null });
}
function leaveCircle(id){
  setState({ joinedCircles: state.joinedCircles.filter(x=>x!==id) });
}
function toggleCircleFilter(f){
  const has = state.circleFilters.includes(f);
  setState({ circleFilters: has ? state.circleFilters.filter(x=>x!==f) : [...state.circleFilters, f] });
}

function renderJoinConfirmModal(){
  if(state.joinConfirmId == null) return '';
  const c = allCircles().find(x => x.id === state.joinConfirmId);
  if(!c) return '';
  return '<div class="center-modal-backdrop" onclick="if(event.target===this) cancelJoinConfirm()"><div class="center-modal">'
    + '<span class="eyebrow">Join Circle</span>'
    + '<h2 style="font-size:21px; margin-top:6px;">Join this circle?</h2>'
    + '<div class="center-modal-sub">'+c.name+'</div>'
    + '<div class="center-modal-text">You\'ll grow alongside '+c.members+' others.</div>'
    + '<div class="center-modal-actions"><button class="modal-btn-ghost" onclick="cancelJoinConfirm()">Not yet</button><button class="modal-btn-solid" onclick="confirmJoin()">Yes, join</button></div>'
    + '</div></div>';
}

function renderSwapModal(){
  if(state.swapTargetId == null) return '';
  const pool = allCircles();
  const newCircle = pool.find(x => x.id === state.swapTargetId);
  if(!newCircle) return '';
  const rows = state.joinedCircles.map(id => pool.find(c=>c.id===id)).filter(Boolean).map(c =>
    '<div class="swap-row"><div><span class="eyebrow">'+c.category+'</span><div class="swap-row-title">'+c.name+'</div><div class="swap-row-sub">'+c.members+'/'+c.capacity+' members</div></div><button class="swap-btn" onclick="performSwap('+c.id+')">'+icon('swap')+'</button></div>'
  ).join('');
  return '<div class="center-modal-backdrop" onclick="if(event.target===this) cancelSwap()"><div class="center-modal" style="text-align:left; max-width:340px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:flex-start;"><span class="eyebrow">Drop to swap</span><button class="close-x" onclick="cancelSwap()">✕</button></div>'
    + '<h2 style="font-size:21px; margin-top:4px;">Swap an Active Circle</h2>'
    + '<p class="center-modal-text" style="text-align:left;">You can be part of 2 circles at a time. Choose one to drop to make room for <strong>'+newCircle.name+'</strong>.</p>'
    + rows
    + '<button class="modal-btn-cancel-full" onclick="cancelSwap()">Cancel</button>'
    + '</div></div>';
}

/* ---------- Circle chat ---------- */
function openCircle(id){
  setState({ activeCircleId: id, circleInfoOpen:false });
}
function closeCircleChat(){
  setState({ activeCircleId: null, circleInfoOpen:false });
}
function circleMessagesFor(id){
  return state.circleMessages[id] || CIRCLE_SEED[id] || [{id:'gen-'+id, author:'Selah Team', text:'Welcome to the circle! Introduce yourself and share what brought you here.'}];
}
function sendCircleMessage(){
  const id = state.activeCircleId;
  const text = state.circleChatDraft.trim();
  if(!text) return;
  const existing = circleMessagesFor(id);
  const newMsg = {id:'u'+Date.now(), author: state.name || 'You', text};
  setState({
    circleMessages: Object.assign({}, state.circleMessages, {[id]: [...existing, newMsg]}),
    circleChatDraft: ''
  });
}
function closeCircleInfo(){ setState({ circleInfoOpen:false }); }
function setCircleInfoTab(t){ setState({ circleInfoTab: t }); }

function renderCircleChat(){
  const c = allCircles().find(x => x.id === state.activeCircleId);
  if(!c) return '';
  const messages = circleMessagesFor(c.id);
  const feed = messages.map(m => '<div class="circle-msg-row"><div class="circle-avatar">'+initials(m.author)+'</div><div class="circle-bubble"><div class="circle-bubble-author">'+m.author+'</div><div class="circle-bubble-text">'+m.text+'</div></div></div>').join('');

  return ''
    + '<div class="circle-chat-header">'
    + '<button class="circle-back-btn" onclick="closeCircleChat()">'+icon('arrowleft')+'</button>'
    + '<div class="circle-chat-title-wrap"><div class="circle-chat-title">'+c.name+'</div><div class="circle-chat-sub">'+icon('book','class="meta-icon"')+' '+c.category+' · <strong>'+(c.live?'LIVE':'OPEN')+'</strong></div></div>'
    + '<button class="circle-info-btn" onclick="setState({circleInfoOpen:true, circleInfoTab:\'overview\'})">'+icon('info')+'</button>'
    + '</div>'
    + '<div style="padding-bottom:8px;">'+feed+'</div>'
    + '<div class="circle-input-row">'
    + '<input class="circle-input" data-field="circle-draft" placeholder="Share a thought…" value="'+state.circleChatDraft+'" oninput="setState({circleChatDraft:this.value})">'
    + '<button class="circle-send-btn" onclick="sendCircleMessage()">'+icon('send')+'</button>'
    + '</div>'
    + '<div style="height:10px;"></div>';
}

function renderCircleInfoSheet(){
  if(!state.circleInfoOpen || state.activeCircleId == null) return '';
  const c = allCircles().find(x => x.id === state.activeCircleId);
  if(!c) return '';
  const tab = state.circleInfoTab;

  const overviewPane = ''
    + '<div class="current-chapter-box"><span class="eyebrow">Current Chapter</span><div class="current-chapter-heading">'+c.currentChapter+'</div></div>'
    + '<div class="moderator-card"><div class="mod-avatar">'+initials(c.leader)+'</div><div><span class="eyebrow">Moderator</span><div class="mod-name">'+c.leader+'</div><div class="mod-bio">'+c.moderatorBio+'</div></div></div>';

  const resourcesPane = ''
    + '<div class="group-details-box"><span class="eyebrow">Group Details</span>'
    + '<div class="gd-row">Topic: '+c.description+'</div>'
    + '<div class="gd-row">Meets: '+c.time+'</div>'
    + '<div class="gd-row">Members: '+c.members+'/'+c.capacity+'</div>'
    + '<div class="gd-row">Length: '+c.length+'</div>'
    + '</div>'
    + '<button class="btn-primary zoom-btn">'+icon('video')+' Join Zoom Session</button>';

  return '<div class="sheet-backdrop" onclick="if(event.target===this) closeCircleInfo()"><div class="sheet">'
    + '<div style="padding:16px 20px 0;"><button class="back-btn" onclick="closeCircleInfo()">Close</button></div>'
    + '<div class="sheet-tabs"><button class="sheet-tab '+(tab==='overview'?'on':'')+'" onclick="setCircleInfoTab(\'overview\')">Overview</button><button class="sheet-tab '+(tab==='resources'?'on':'')+'" onclick="setCircleInfoTab(\'resources\')">Resources & Info</button></div>'
    + '<div class="sheet-body">'+(tab==='overview' ? overviewPane : resourcesPane)+'</div>'
    + '</div></div>';
}

/* ---------- Create-a-Study sheet ---------- */
function openBibleSheet(){
  setState({ bibleSheetOpen:true, verifyStep:null });
}
function closeBibleSheet(){
  setState({ bibleSheetOpen:false, verifyStep:null });
}
function setCreateField(key, val){
  setState({ createForm: Object.assign({}, state.createForm, {[key]:val}) });
}
function createCircle(){
  const f = state.createForm;
  if(!f.name.trim()) return;

  if(f.privacy === 'Public'){
    // Public circles require teacher verification first — simulated for this prototype
    setState({ verifyStep:'pending' });
    return;
  }

  const cap = parseInt(f.capacity, 10) || 12;
  const newCircle = {
    id: 'custom-'+Date.now(),
    category: (f.book || 'General').toUpperCase(),
    name: f.name.trim(),
    leader: state.name || 'You',
    time: f.meetingTime || 'Time TBD',
    members: 1,
    capacity: cap,
    testament: OT_BOOKS.includes(f.book) ? 'OT' : 'NT',
    format: 'Online',
    description: f.description || ''
  };
  const canAutoJoin = state.joinedCircles.length < 2;
  setState({
    customCircles: [...state.customCircles, newCircle],
    joinedCircles: canAutoJoin ? [...state.joinedCircles, newCircle.id] : state.joinedCircles,
    createForm: { name:'', book:'Genesis', meetingTime:MEETING_TIMES[0], capacity:'12', description:'', privacy:'Private' },
    bibleSheetOpen:false
  });
}

function renderBibleSheet(){
  if(!state.bibleSheetOpen) return '';

  if(state.verifyStep === 'pending'){
    return '<div class="sheet-backdrop" onclick="if(event.target===this) closeBibleSheet()">'
      + '<div class="sheet"><div class="sheet-head"><h3 style="font-size:16px;">Verification</h3><button class="close-x" onclick="closeBibleSheet()">✕</button></div>'
      + '<div class="sheet-body verify-box">'
      + '<div class="spinner"></div>'
      + '<h3 style="font-size:16px; margin-top:18px;">Verification in progress</h3>'
      + '<p style="font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.5;">To keep the community safe, teachers must be verified before leading a public circle. An email will be sent to you shortly with next steps.</p>'
      + '<button class="btn-ghost" style="margin-top:20px;" onclick="closeBibleSheet()">Got it</button>'
      + '</div></div></div>';
  }

  const f = state.createForm;
  const bookOptions = '<option value="">Select a book</option>'
    + '<optgroup label="Old Testament">'+OT_BOOKS.map(b=>'<option value="'+b+'" '+(f.book===b?'selected':'')+'>'+b+'</option>').join('')+'</optgroup>'
    + '<optgroup label="New Testament">'+NT_BOOKS.map(b=>'<option value="'+b+'" '+(f.book===b?'selected':'')+'>'+b+'</option>').join('')+'</optgroup>';
  const timeOptions = MEETING_TIMES.map(t=>'<option value="'+t+'" '+(f.meetingTime===t?'selected':'')+'>'+t+'</option>').join('');

  const createPane = ''
    + '<div class="eyebrow">New Circle</div>'
    + '<h2 style="font-size:21px; margin-top:4px; margin-bottom:18px;">Create a Bible Study</h2>'
    + '<div class="form-row"><label class="field-label-caps">Study Name</label><input class="field-input" data-field="cf-name" placeholder="e.g. John: Anchored" value="'+f.name+'" oninput="setCreateField(\'name\', this.value)"></div>'
    + '<div class="form-row"><label class="field-label-caps">Book / Topic</label><div class="select-wrap"><select class="field-select" onchange="setCreateField(\'book\', this.value)">'+bookOptions+'</select>'+icon('chevron','class="select-chevron"')+'</div></div>'
    + '<div class="form-row"><label class="field-label-caps">Meeting Time</label><div class="select-wrap"><select class="field-select" onchange="setCreateField(\'meetingTime\', this.value)">'+timeOptions+'</select>'+icon('chevron','class="select-chevron"')+'</div></div>'
    + '<div class="form-row"><label class="field-label-caps">Member Capacity</label><input class="field-input" type="number" min="2" data-field="cf-capacity" value="'+f.capacity+'" oninput="setCreateField(\'capacity\', this.value)"></div>'
    + '<div class="form-row"><label class="field-label-caps">Description</label><textarea class="field-input" data-field="cf-description" placeholder="What will this study focus on?" oninput="setCreateField(\'description\', this.value)">'+f.description+'</textarea></div>'
    + '<div class="form-row"><label class="field-label-caps">Privacy</label>'
      + '<div class="privacy-toggle-lg">'
      + '<button class="privacy-btn-lg '+(f.privacy==='Public'?'on':'')+'" onclick="setCreateField(\'privacy\',\'Public\')">Public</button>'
      + '<button class="privacy-btn-lg '+(f.privacy==='Private'?'on':'')+'" onclick="setCreateField(\'privacy\',\'Private\')">Private / Link-Only</button>'
      + '</div>'
      + '<p class="privacy-note">Public studies require leader verification. Go to Profile → Leader Verification to get verified.</p>'
      + '<p class="privacy-note">Only people with your invite link can join this study.</p>'
      + '</div>'
    + (state.joinedCircles.length >= 2 && f.privacy==='Private' ? '<p style="font-size:12px; color:var(--danger); margin-bottom:10px;">You\'re already in 2 circles — creating this one won\'t auto-join you, but others can still join it.</p>' : '')
    + '<button class="btn-primary" style="margin-top:6px;" onclick="createCircle()">Create Study</button>';

  return '<div class="sheet-backdrop" onclick="if(event.target===this) closeBibleSheet()">'
    + '<div class="sheet"><button class="close-x sheet-close-abs" onclick="closeBibleSheet()">✕</button>'
    + '<div class="sheet-body" style="padding-top:20px;">'+createPane+'</div>'
    + '</div></div>';
}

function renderProfile(){
  const current = state.prayers.filter(p=>p.status==='current');
  const answered = state.prayers.filter(p=>p.status==='answered');
  return ''
    + '<div class="app-topbar"><h2 style="font-size:20px;">Profile</h2></div>'
    + '<div class="pad" style="padding-top:0; display:flex; align-items:center; gap:14px;">'
    + '<div class="avatar-circle">'+initials(state.name)+'</div>'
    + '<div><div style="font-family:Merriweather,serif; font-size:17px; font-weight:700;">'+(state.name||'Friend')+'</div>'
    + '<div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">'+(state.location||'Location not set')+'</div></div>'
    + '</div>'
    + '<div class="pad" style="padding-top:0;"><button class="btn-ghost" onclick="setState({editingProfile:!state.editingProfile})">'+(state.editingProfile?'Close':'Edit Profile')+'</button></div>'
    + (state.editingProfile ? '<div class="card" style="margin-top:0;">'
        + '<label class="field-label">Name</label><input class="field-input" data-field="profile-name" style="margin-bottom:10px;" value="'+state.name+'" oninput="setState({name:this.value})">'
        + '<label class="field-label">Location</label><input class="field-input" data-field="profile-location" value="'+state.location+'" oninput="setState({location:this.value})">'
      + '</div>' : '')
    + '<div class="card">'
    + '<div class="card-title">Prayers</div>'
    + '<div class="toggle-pills" style="margin:0 0 10px;">'
    + '<span class="toggle-pill on">Current ('+current.length+')</span>'
    + '<span class="toggle-pill">Answered ('+answered.length+')</span>'
    + '</div>'
    + (current.map(p => '<div style="padding:10px 0; border-top:1px solid var(--line); font-size:13.5px;">'+p.text+'<div style="margin-top:6px;"><button class="btn-link" onclick="moveToAnswered('+p.id+')">Mark as answered</button></div></div>').join('') || '<div class="empty-note">No current prayers.</div>')
    + '</div>'
    + '<div class="card" style="padding:0; overflow:hidden;">'
    + '<div class="settings-row"><span>Notifications</span><span style="color:var(--ink-soft);">On</span></div>'
    + '<div class="settings-row"><span>Privacy</span><span style="color:var(--ink-soft);">Manage</span></div>'
    + '<div class="settings-row"><span>Account</span><span style="color:var(--ink-soft);">Manage</span></div>'
    + '</div>'
    + '<div class="card">'
    + '<div class="card-title">About Selah</div>'
    + '<p style="font-size:13px; color:var(--ink-soft); line-height:1.5;">Selah is a space to find your community and build your own — through shared prayer, honest struggle, and Scripture read together.</p>'
    + '</div>'
    + '<div class="pad" style="padding-top:0;"><button class="btn-ghost" style="border-color:var(--danger); color:var(--danger);" onclick="logout()">Log Out</button></div>';
}
function moveToAnswered(id){
  setState({ prayers: state.prayers.map(p => p.id===id ? Object.assign({},p,{status:'answered'}) : p) });
}
function logout(){
  state = {
    screen:'splash', authMode:'signup', email:'', password:'', confirmPassword:'', name:'', location:'', locCity:'', locState:'', locCountry:'', book:null,
    interests:[], customInterest:'', struggles:[], transitionIndex:0, tab:'home', streak:4,
    wallPrayer:{author:'Anonymous', location:'South Africa', flag:'ZA', text:'Please pray for wisdom as I navigate a difficult career change and seek God\'s direction for my family during this uncertain transition.', count:42, prayed:false},
    myPrayerDraft:'', myPrayerAnonymous:false, prayerSheetOpen:false,
    prayers:[{id:1, text:'Praying for clarity on a big decision I have to make this month.', status:'current'}],
    discussionSearch:'', selectedDiscussion:'Daily Scripture Reflections', discussionMessages:{}, discussionDraft:'', amenedIds:[],
    circleSearch:'', circleFilters:[], joinedCircles:[], customCircles:[],
    joinConfirmId:null, swapTargetId:null, activeCircleId:null, circleInfoOpen:false, circleInfoTab:'overview', circleMessages:{}, circleChatDraft:'',
    bibleSheetOpen:false, bsView:'home', verifyStep:null, createForm:{name:'',book:'Genesis',meetingTime:'Sundays, 9:00 AM',capacity:'12',description:'',privacy:'Private'},
    bookSheetOpen:false, editingProfile:false
  };
  render();
}

/* ---------- Main render ---------- */
let lastRenderedScreen = null;
function render(){
  const screenEl = document.getElementById('screen');
  const tabbarEl = document.getElementById('tabbar');

  // Preserve whatever text field the user is typing in, since re-rendering
  // replaces the DOM node and would otherwise steal focus/cursor position.
  const active = document.activeElement;
  let focusInfo = null;
  if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.hasAttribute('data-field')){
    focusInfo = { field: active.getAttribute('data-field'), start: active.selectionStart, end: active.selectionEnd };
  }

  let html = '';
  switch(state.screen){
    case 'splash': html = renderSplash(); break;
    case 'auth': html = renderAuth(); break;
    case 'location': html = renderLocation(); break;
    case 'book': html = renderBook(); break;
    case 'interests': html = renderInterests(); break;
    case 'struggles': html = renderStruggles(); break;
    case 'transition': html = renderTransition(); break;
    case 'app': html = renderApp(); break;
  }
  screenEl.innerHTML = html;
  if(state.screen !== lastRenderedScreen){ screenEl.scrollTop = 0; }
  lastRenderedScreen = state.screen;
  if(state.screen === 'app'){
    tabbarEl.classList.remove('hidden');
    tabbarEl.innerHTML = renderTabbar();
  } else {
    tabbarEl.classList.add('hidden');
  }
  let modalHtml = '';
  if(state.screen==='app' && state.tab==='biblestudy'){
    if(state.bibleSheetOpen) modalHtml = renderBibleSheet();
    else if(state.circleInfoOpen) modalHtml = renderCircleInfoSheet();
    else if(state.joinConfirmId != null) modalHtml = renderJoinConfirmModal();
    else if(state.swapTargetId != null) modalHtml = renderSwapModal();
  }
  else if(state.screen==='app' && state.tab==='home') modalHtml = renderPrayerSheet();
  else if(state.screen==='book') modalHtml = renderBookSheet();
  document.getElementById('modal-root').innerHTML = modalHtml;

  if(focusInfo){
    const el = document.querySelector('[data-field="'+focusInfo.field+'"]');
    if(el){
      el.focus();
      if(typeof el.setSelectionRange === 'function' && typeof focusInfo.start === 'number'){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

render();
</script>
