<!doctype html><html><body style="margin:0">
<iframe id="c" src="/__preview.html?view=prayers" style="width:390px;height:844px;border:0"></iframe>
<pre id="out" style="font:12px monospace"></pre>
<script>
const log = [];
const doc = () => document.getElementById('c').contentDocument;
const w = () => document.getElementById('c').contentWindow;
setTimeout(() => { w().addEventListener('error', e => log.push('ERR ' + e.message)); doc().querySelector('.heart-btn').click(); log.push('clicked'); }, 2000);
for (const t of [2200, 2600, 3000, 4000, 6000, 7000]) setTimeout(() => {
  const d = doc(); log.push(t + ': toast=' + !!d.querySelector('.toast') + ' tabs=' + [...d.querySelectorAll('.pill-tab')].map(b => b.textContent).join('|'));
  document.getElementById('out').textContent = log.join('\n');
}, t);
</script></body></html>
