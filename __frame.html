<!doctype html><html><body style="margin:0;display:flex;gap:20px;background:#888">
<iframe id="a" src="/__preview.html" style="width:390px;height:844px;border:0"></iframe>
<iframe id="b" src="/__preview.html?dark" style="width:390px;height:844px;border:0"></iframe>
<pre id="out" style="position:absolute;bottom:0;left:0;background:#fff;margin:0;font:14px monospace"></pre>
<script>
setTimeout(() => {
  const r = [];
  for (const id of ['a','b']) {
    const d = document.getElementById(id).contentDocument;
    const de = d.documentElement, sc = d.querySelector('.screen');
    r.push(id + ': doc ' + de.scrollWidth + '/' + de.clientWidth + '  screen ' + sc.scrollWidth + '/' + sc.clientWidth);
    for (const el of d.querySelectorAll('.screen *')) {
      const b = el.getBoundingClientRect();
      if (b.right > de.clientWidth + 0.5) { r.push('  overflow: ' + el.className + ' right=' + b.right.toFixed(1)); }
    }
  }
  document.getElementById('out').textContent = r.join('\n');
  document.title = 'done';
}, 3000);
</script></body></html>
